<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI3 魔法午餐分類帽</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;color:#f4e7bd;font-family:"Microsoft JhengHei",Arial,sans-serif}
#scene{position:fixed;inset:0}
canvas{display:block}

.vignette{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 45%,transparent 20%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.86) 100%);
}

header{
  position:fixed;top:25px;left:50%;transform:translateX(-50%);
  text-align:center;z-index:10;pointer-events:none;
}
header small{letter-spacing:5px;color:#b89c62;font-size:11px}
header h1{
  margin:7px 0 0;font-family:Georgia,serif;font-size:25px;
  font-weight:normal;letter-spacing:2px;color:#f4dfad;
  text-shadow:0 0 20px rgba(213,171,91,.35);
}

.panel{
  position:fixed;left:28px;top:50%;transform:translateY(-50%);
  width:255px;padding:22px;z-index:10;
  border:1px solid rgba(216,180,106,.25);
  background:linear-gradient(145deg,rgba(26,20,13,.87),rgba(8,8,8,.75));
  backdrop-filter:blur(14px);
  border-radius:7px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.panel-title{
  font-family:Georgia,serif;color:#d7b66f;font-size:16px;
  padding-bottom:12px;border-bottom:1px solid rgba(216,180,106,.18);
  margin-bottom:18px;
}
.group{margin-bottom:18px}
.group-title{font-size:12px;color:#9d895e;margin-bottom:9px;letter-spacing:1px}
select{
  width:100%;background:#15110c;color:#ead8ad;border:1px solid #55462d;
  border-radius:4px;padding:9px;
}
.check{display:block;font-size:13px;margin:8px 0;color:#d8c9a8;cursor:pointer}
.check input{accent-color:#b38b43;margin-right:7px}

.count{
  font-size:12px;color:#968461;text-align:center;margin:13px 0;
}
.count b{color:#e3c77e;font-size:18px}

.magic-button{
  width:100%;padding:12px;border:1px solid #b89550;
  color:#f6e6bd;cursor:pointer;border-radius:4px;
  font-family:Georgia,serif;letter-spacing:1px;
  background:linear-gradient(#745326,#3c2b15);
  box-shadow:inset 0 0 20px rgba(255,207,110,.08),0 0 20px rgba(184,145,72,.1);
  transition:.25s;
}
.magic-button:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(194,153,77,.28)}
.magic-button:disabled{opacity:.35;cursor:not-allowed;transform:none}

.dialogue{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
  width:min(590px,90%);text-align:center;z-index:9;pointer-events:none;
}
#speech{
  font-family:Georgia,"Microsoft JhengHei",serif;
  color:#e8d6ad;font-size:17px;letter-spacing:.5px;
  text-shadow:0 2px 10px #000;
  min-height:26px;
}
.hint{font-size:10px;color:#786d58;margin-top:8px;letter-spacing:2px}

.result{
  display:none;position:fixed;inset:0;z-index:30;
  background:rgba(3,3,3,.72);backdrop-filter:blur(7px);
  align-items:center;justify-content:center;
}
.result.show{display:flex}
.result-card{
  width:min(500px,90%);padding:38px;text-align:center;
  border:1px solid rgba(218,180,101,.55);
  border-radius:8px;
  background:
   radial-gradient(circle at 50% 0,rgba(150,105,41,.18),transparent 50%),
   #100d09;
  box-shadow:0 0 90px rgba(180,129,50,.18);
}
.result-label{font-size:10px;letter-spacing:5px;color:#9d8150}
.result-card h2{
  font-family:Georgia,"Microsoft JhengHei",serif;
  color:#f3d992;font-size:32px;font-weight:normal;margin:16px 0 8px;
}
.result-meta{color:#b9a984;font-size:13px}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:20px}
.tag{
  padding:5px 10px;border:1px solid rgba(190,156,90,.25);
  border-radius:20px;color:#c9b68e;font-size:11px;
}
.actions{display:flex;gap:8px;justify-content:center;margin-top:24px}
.actions button{
  border:1px solid #6e5830;background:#19130c;color:#d9c28e;
  padding:10px 17px;border-radius:4px;cursor:pointer;
}
.actions .primary{background:#725326;color:#fff0c7;border-color:#a78042}

@media(max-width:760px){
  .panel{left:12px;right:12px;top:auto;bottom:12px;transform:none;width:auto;padding:13px}
  .panel-title,.food-group{display:none}
  .group{display:inline-block;width:48%;margin-bottom:10px}
  header{top:15px}
  .dialogue{bottom:190px}
}
</style>
</head>

<body>

<div id="scene"></div>
<div class="vignette"></div>

<header>
  <small>AI3 · NANGANG</small>
  <h1>THE ENCHANTED LUNCH HAT</h1>
</header>

<aside class="panel">
  <div class="panel-title">午餐魔法條件</div>

  <div class="group">
    <div class="group-title">願意踏出多遠？</div>
    <select id="distance">
      <option value="500">500 公尺內</option>
      <option value="1000">1 公里內</option>
      <option value="2000" selected>2 公里內</option>
    </select>
  </div>

  <div class="group">
    <div class="group-title">環境咒語</div>
    <label class="check">
      <input id="ac" type="checkbox" checked>
      必須有冷氣
    </label>
  </div>

  <div class="group food-group">
    <div class="group-title">今日胃口</div>
    <div id="foods"></div>
  </div>

  <div class="count">
    魔法帽感應到 <b id="count">0</b> 間餐廳
  </div>

  <button id="choose" class="magic-button">
    讓魔法帽決定
  </button>
</aside>

<div class="dialogue">
  <div id="speech">「Hmm... 今天的你，想吃些什麼呢？」</div>
  <div class="hint">DRAG TO LOOK AROUND · SCROLL TO MOVE</div>
</div>

<div id="result" class="result">
  <div class="result-card">
    <div class="result-label">THE HAT HAS DECIDED</div>
    <h2 id="resultName"></h2>
    <div id="resultMeta" class="result-meta"></div>
    <div id="tags" class="tags"></div>

    <div class="actions">
      <button id="again">不服，再問一次</button>
      <button id="back" class="primary">接受命運</button>
    </div>
  </div>
</div>

<script>
/* ======================================================
   RESTAURANT DATA
   之後主要修改這裡即可
====================================================== */

const restaurants=[
 {name:"樂法 Le Phu",distance:300,ac:true,types:["漢堡/美式","其他/小吃"]},
 {name:"園區牛肉麵",distance:420,ac:true,types:["麵"]},
 {name:"南港漢堡研究所",distance:480,ac:true,types:["漢堡/美式"]},
 {name:"咖哩研究社",distance:560,ac:true,types:["飯"]},
 {name:"南港燒餅店",distance:650,ac:false,types:["其他/小吃"]},
 {name:"健康廚房",distance:850,ac:true,types:["飯","健康餐/沙拉"]},
 {name:"南港水餃館",distance:920,ac:true,types:["鍋貼/水餃","麵"]},
 {name:"日式烏龍麵",distance:980,ac:true,types:["麵"]},
 {name:"南港湯包小館",distance:1100,ac:true,types:["其他/小吃"]},
 {name:"朱記餡餅粥店",distance:1200,ac:true,types:["麵","飯","鍋貼/水餃"]},
 {name:"昆陽雞肉飯",distance:1550,ac:true,types:["飯","其他/小吃"]},
 {name:"清爽沙拉研究所",distance:1800,ac:true,types:["健康餐/沙拉"]}
];

const foodTypes=[
 "麵","飯","鍋貼/水餃",
 "漢堡/美式","健康餐/沙拉","其他/小吃"
];

/* ======================================================
   FILTER UI
====================================================== */

const foods=document.getElementById("foods");

foodTypes.forEach(type=>{
 const label=document.createElement("label");
 label.className="check";

 const input=document.createElement("input");
 input.type="checkbox";
 input.value=type;
 input.checked=true;

 label.appendChild(input);
 label.append(type);

 foods.appendChild(label);
});

function filteredRestaurants(){

 const distance=Number(document.getElementById("distance").value);
 const needAC=document.getElementById("ac").checked;

 const selected=[
   ...foods.querySelectorAll("input:checked")
 ].map(x=>x.value);

 return restaurants.filter(r=>
   r.distance<=distance &&
   (!needAC || r.ac) &&
   r.types.some(t=>selected.includes(t))
 );
}

function updateFilter(){

 const list=filteredRestaurants();

 document.getElementById("count").textContent=list.length;
 document.getElementById("choose").disabled=list.length===0;

 if(list.length===0){
   setSpeech("「Hmm... 你的條件太嚴格了，我什麼都感應不到。」");
 }else{
   setSpeech("「很好……我感覺到 " + list.length + " 種可能。」");
 }
}

document.querySelectorAll("input,select")
 .forEach(el=>el.addEventListener("change",updateFilter));

/* ======================================================
   THREE.JS
====================================================== */

const container=document.getElementById("scene");

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x070707,.055);

const camera=new THREE.PerspectiveCamera(
 45,
 window.innerWidth/window.innerHeight,
 .1,
 100
);

camera.position.set(0,1.7,8);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);

/* ======================================================
   LIGHTING
====================================================== */

scene.add(new THREE.AmbientLight(0x6b5439,.45));

const keyLight=new THREE.PointLight(
 0xffb24c,
 2.5,
 20
);

keyLight.position.set(0,4,4);
keyLight.castShadow=true;

scene.add(keyLight);

const rimLight=new THREE.PointLight(
 0x6551aa,
 1.2,
 15
);

rimLight.position.set(-4,3,-3);

scene.add(rimLight);

/* ======================================================
   STONE FLOOR
====================================================== */

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(10,64),
 new THREE.MeshStandardMaterial({
   color:0x17130f,
   roughness:.95,
   metalness:.05
 })
);

floor.rotation.x=-Math.PI/2;
floor.position.y=-1.75;
floor.receiveShadow=true;

scene.add(floor);

/* Decorative rings */

for(let r=2;r<8;r+=1.5){

 const ring=new THREE.Mesh(
   new THREE.RingGeometry(r,r+.015,90),
   new THREE.MeshBasicMaterial({
     color:0x5a4729,
     transparent:true,
     opacity:.32,
     side:THREE.DoubleSide
   })
 );

 ring.rotation.x=-Math.PI/2;
 ring.position.y=-1.73;

 scene.add(ring);
}

/* ======================================================
   MAGIC HAT
====================================================== */

const hat=new THREE.Group();
scene.add(hat);

hat.position.y=-.35;

/* brim */

const brim=new THREE.Mesh(
 new THREE.CylinderGeometry(2.05,2.3,.22,48),
 new THREE.MeshStandardMaterial({
   color:0x3a2414,
   roughness:.93
 })
);

brim.scale.z=.65;
brim.castShadow=true;

hat.add(brim);

/* crown */

const crownGeometry=new THREE.CylinderGeometry(
 .38,
 1.35,
 2.8,
 32,
 8
);

const positions=crownGeometry.attributes.position;

for(let i=0;i<positions.count;i++){

 const x=positions.getX(i);
 const y=positions.getY(i);
 const z=positions.getZ(i);

 const deformation=
   Math.sin(y*3+x*2)*.08 +
   Math.cos(z*5)*.05;

 positions.setX(i,x+deformation);
 positions.setZ(i,z+deformation*.6);
}

crownGeometry.computeVertexNormals();

const crown=new THREE.Mesh(
 crownGeometry,
 new THREE.MeshStandardMaterial({
   color:0x422817,
   roughness:1
 })
);

crown.position.y=1.35;
crown.rotation.z=-.15;
crown.castShadow=true;

hat.add(crown);

/* bent top */

const tip=new THREE.Mesh(
 new THREE.ConeGeometry(.65,1.45,28),
 new THREE.MeshStandardMaterial({
   color:0x392214,
   roughness:1
 })
);

tip.position.set(-.35,3.0,0);
tip.rotation.z=.55;

hat.add(tip);

/* face folds */

const eyeMaterial=new THREE.MeshBasicMaterial({
 color:0x080604
});

function eye(x){

 const e=new THREE.Mesh(
   new THREE.SphereGeometry(.14,16,8),
   eyeMaterial
 );

 e.scale.set(1.4,.35,.3);
 e.position.set(x,1.45,1.15);

 return e;
}

const leftEye=eye(-.42);
const rightEye=eye(.42);

hat.add(leftEye,rightEye);

/* mouth */

const mouth=new THREE.Mesh(
 new THREE.TorusGeometry(.42,.055,8,30,Math.PI),
 new THREE.MeshBasicMaterial({
   color:0x090604
 })
);

mouth.position.set(0,.85,1.19);
mouth.rotation.z=Math.PI;

hat.add(mouth);

/* ======================================================
   FLOATING CANDLES
====================================================== */

const candles=[];

for(let i=0;i<22;i++){

 const candle=new THREE.Group();

 const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.035,.04,.45,10),
   new THREE.MeshStandardMaterial({
     color:0xe8d9b1
   })
 );

 const flame=new THREE.Mesh(
   new THREE.SphereGeometry(.045,10,10),
   new THREE.MeshBasicMaterial({
     color:0xffa62b
   })
 );

 flame.scale.y=1.7;
 flame.position.y=.27;

 candle.add(body,flame);

 const angle=Math.random()*Math.PI*2;
 const radius=4+Math.random()*5;

 candle.position.set(
   Math.cos(angle)*radius,
   .5+Math.random()*5,
   Math.sin(angle)*radius
 );

 candle.userData.baseY=candle.position.y;
 candle.userData.speed=.3+Math.random()*.6;
 candle.userData.offset=Math.random()*10;

 scene.add(candle);
 candles.push(candle);
}

/* ======================================================
   MAGIC PARTICLES
====================================================== */

const particleCount=500;

const particleGeometry=new THREE.BufferGeometry();
const particlePositions=new Float32Array(particleCount*3);

for(let i=0;i<particleCount;i++){

 particlePositions[i*3]=(Math.random()-.5)*16;
 particlePositions[i*3+1]=Math.random()*8-2;
 particlePositions[i*3+2]=(Math.random()-.5)*16;
}

particleGeometry.setAttribute(
 "position",
 new THREE.BufferAttribute(particlePositions,3)
);

const particleMaterial=new THREE.PointsMaterial({
 color:0xd9ae62,
 size:.025,
 transparent:true,
 opacity:.55
});

const particles=new THREE.Points(
 particleGeometry,
 particleMaterial
);

scene.add(particles);

/* ======================================================
   FLOATING RESTAURANT TEXT
====================================================== */

let restaurantSprites=[];

function textTexture(text){

 const canvas=document.createElement("canvas");
 canvas.width=800;
 canvas.height=150;

 const ctx=canvas.getContext("2d");

 ctx.font="32px Georgia";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 ctx.fillStyle="#ead59e";
 ctx.shadowColor="#d9a84e";
 ctx.shadowBlur=15;

 ctx.fillText(text,400,75);

 const texture=new THREE.CanvasTexture(canvas);

 return texture;
}

function createRestaurantSpirits(){

 restaurantSprites.forEach(s=>scene.remove(s));
 restaurantSprites=[];

 const list=filteredRestaurants();

 list.forEach((r,i)=>{

   const material=new THREE.SpriteMaterial({
     map:textTexture(r.name),
     transparent:true,
     opacity:.42
   });

   const sprite=new THREE.Sprite(material);

   const angle=i/list.length*Math.PI*2;

   sprite.position.set(
     Math.cos(angle)*4,
     .4+Math.sin(i*1.4)*1.2,
     Math.sin(angle)*4
   );

   sprite.scale.set(2.5,.47,1);

   sprite.userData.angle=angle;

   scene.add(sprite);
   restaurantSprites.push(sprite);
 });
}

/* ======================================================
   SORTING SEQUENCE
====================================================== */

let sorting=false;
let sortingStart=0;
let chosenRestaurant=null;

const speeches=[
 "「Hmm... 讓我看看……」",
 "「你今天似乎不想走得太遠……」",
 "「我聞到了午餐的氣息……」",
 "「飯？麵？還是某種更危險的選擇……」",
 "「有了。我知道你今天該去哪裡了。」"
];

function setSpeech(text){
 document.getElementById("speech").textContent=text;
}

function startSorting(){

 if(sorting)return;

 const list=filteredRestaurants();
 if(!list.length)return;

 chosenRestaurant=
   list[Math.floor(Math.random()*list.length)];

 sorting=true;
 sortingStart=performance.now();

 document.getElementById("choose").disabled=true;

 createRestaurantSpirits();

 setSpeech(speeches[0]);
}

document.getElementById("choose")
 .addEventListener("click",startSorting);

function finishSorting(){

 sorting=false;

 const r=chosenRestaurant;

 setSpeech("「那麼—— " + r.name + "！」");

 document.getElementById("resultName").textContent=r.name;

 const minutes=Math.max(
   3,
   Math.round(r.distance/80)
 );

 document.getElementById("resultMeta").textContent=
   r.distance+" 公尺 · 步行約 "+minutes+" 分鐘";

 const tags=document.getElementById("tags");
 tags.innerHTML="";

 [
   r.ac?"有冷氣":"無冷氣",
   ...r.types
 ].forEach(text=>{

   const tag=document.createElement("span");
   tag.className="tag";
   tag.textContent=text;

   tags.appendChild(tag);
 });

 setTimeout(()=>{
   document.getElementById("result").classList.add("show");
 },650);

 document.getElementById("choose").disabled=false;
}

/* ======================================================
   RESULT ACTIONS
====================================================== */

document.getElementById("again").onclick=()=>{
 document.getElementById("result").classList.remove("show");
 startSorting();
};

document.getElementById("back").onclick=()=>{
 document.getElementById("result").classList.remove("show");
};

/* ======================================================
   CAMERA INTERACTION
====================================================== */

let dragging=false;
let lastX=0;
let cameraAngle=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
});

window.addEventListener("pointerup",()=>{
 dragging=false;
});

window.addEventListener("pointermove",e=>{

 if(!dragging)return;

 cameraAngle+=(e.clientX-lastX)*.004;
 lastX=e.clientX;
});

renderer.domElement.addEventListener("wheel",e=>{

 camera.position.z+=e.deltaY*.003;
 camera.position.z=Math.max(5,Math.min(11,camera.position.z));
});

/* ======================================================
   ANIMATION LOOP
====================================================== */

function animate(time){

 requestAnimationFrame(animate);

 const t=time*.001;

 /* camera orbit */

 if(!dragging){
   cameraAngle+=.00035;
 }

 camera.position.x=Math.sin(cameraAngle)*1.5;
 camera.lookAt(0,.7,0);

 /* hat idle */

 if(!sorting){

   hat.rotation.y=Math.sin(t*.45)*.08;
   hat.position.y=-.35+Math.sin(t*.8)*.025;

 }else{

   const elapsed=time-sortingStart;

   hat.rotation.y=
     Math.sin(elapsed*.015)*.17;

   hat.rotation.z=
     Math.sin(elapsed*.021)*.035;

   crown.scale.y=
     1+Math.sin(elapsed*.018)*.025;

   mouth.scale.y=
     .7+Math.abs(Math.sin(elapsed*.012))*1.6;

   particles.rotation.y+=.015;

   restaurantSprites.forEach((sprite,i)=>{

     sprite.userData.angle+=.025;

     sprite.position.x=
       Math.cos(sprite.userData.angle)*3.6;

     sprite.position.z=
       Math.sin(sprite.userData.angle)*3.6;

     sprite.material.opacity=
       .35+Math.sin(t*5+i)*.22;
   });

   if(elapsed>650 && elapsed<1300){
     setSpeech(speeches[1]);
   }

   if(elapsed>1300 && elapsed<2000){
     setSpeech(speeches[2]);
   }

   if(elapsed>2000 && elapsed<2750){
     setSpeech(speeches[3]);
   }

   if(elapsed>2750 && elapsed<3400){
     setSpeech(speeches[4]);
   }

   if(elapsed>3800){
     finishSorting();
   }
 }

 /* candles */

 candles.forEach(c=>{

   c.position.y=
     c.userData.baseY+
     Math.sin(t*c.userData.speed+c.userData.offset)*.15;

   const flame=c.children[1];

   flame.scale.y=
     1.4+Math.sin(t*8+c.userData.offset)*.35;
 });

 particles.rotation.y+=.0004;

 renderer.render(scene,camera);
}

updateFilter();
createRestaurantSpirits();
animate(0);

/* ======================================================
   RESIZE
====================================================== */

window.addEventListener("resize",()=>{

 camera.aspect=
   window.innerWidth/window.innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
   window.innerWidth,
   window.innerHeight
 );
});
</script>

</body>
</html>
