<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI3 魔法午餐分類帽</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* =========================================================
   01. BASE
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --cream:#f8f2e6;
  --paper:#fffdf7;
  --gold:#d89c37;
  --deep-gold:#a86d19;
  --brown:#5d412b;
  --deep-brown:#34271f;
  --wood:#936a45;
  --green:#55745a;
  --wine:#8c4f4d;
  --line:rgba(93,65,43,.14);
  --shadow:0 24px 70px rgba(83,59,36,.13);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  color:var(--deep-brown);

  background:
    radial-gradient(
      circle at 50% 30%,
      #fffdf6 0%,
      #f8f0df 50%,
      #eadcc5 100%
    );
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   02. BACKGROUND
========================================================= */

.magic-bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.sun-glow{
  position:absolute;
  width:700px;
  height:700px;

  top:-360px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,238,182,.95),
      rgba(255,238,182,.3) 45%,
      transparent 70%
    );
}

.window{
  position:absolute;

  top:8%;
  left:50%;

  width:290px;
  height:520px;

  transform:translateX(-50%);

  border-radius:150px 150px 15px 15px;

  border:18px solid rgba(141,102,64,.11);

  box-shadow:
    inset 0 0 80px rgba(255,226,154,.32);

  opacity:.5;
}

.window::before{
  content:"";

  position:absolute;
  left:50%;
  top:0;
  bottom:0;

  width:10px;

  background:rgba(141,102,64,.09);

  transform:translateX(-50%);
}

.window::after{
  content:"";

  position:absolute;
  left:0;
  right:0;
  top:45%;

  height:10px;

  background:rgba(141,102,64,.09);
}

.bg-orb{
  position:absolute;
  border-radius:50%;

  filter:blur(2px);

  animation:floatOrb 7s ease-in-out infinite;
}

.orb1{
  width:10px;
  height:10px;

  left:18%;
  top:30%;

  background:#dfae51;

  box-shadow:
    0 0 25px rgba(223,174,81,.9);
}

.orb2{
  width:7px;
  height:7px;

  right:18%;
  top:42%;

  background:#e9ba64;

  animation-delay:-2s;
}

.orb3{
  width:6px;
  height:6px;

  left:28%;
  bottom:20%;

  background:#c38a32;

  animation-delay:-4s;
}

@keyframes floatOrb{
  0%,100%{
    transform:translateY(0);
    opacity:.35;
  }

  50%{
    transform:translateY(-25px);
    opacity:1;
  }
}

/* =========================================================
   03. HEADER
========================================================= */

header{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:86px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 38px;

  z-index:20;

  border-bottom:1px solid var(--line);

  background:rgba(255,253,247,.7);

  backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #e2b45e,
      #b77b26
    );

  color:white;

  font-family:Georgia,serif;
  font-weight:bold;
  font-size:19px;

  box-shadow:
    0 9px 25px rgba(173,116,31,.25);
}

.brand-title{
  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:19px;
  font-weight:bold;
}

.brand-sub{
  margin-top:3px;

  font-size:10px;

  letter-spacing:.18em;

  color:#94775c;
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;

  color:#866b53;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#6b8e65;

  box-shadow:
    0 0 10px rgba(107,142,101,.55);
}

/* =========================================================
   04. APP LAYOUT
========================================================= */

.app{
  position:absolute;

  top:86px;
  left:0;
  right:0;
  bottom:0;

  display:grid;

  grid-template-columns:330px 1fr;

  z-index:5;
}

/* =========================================================
   05. SIDEBAR
========================================================= */

.sidebar{
  padding:27px 24px;

  overflow-y:auto;

  border-right:1px solid var(--line);

  background:
    rgba(255,253,247,.72);

  backdrop-filter:blur(20px);
}

.sidebar-kicker{
  color:var(--deep-gold);

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;
}

.sidebar h2{
  margin-top:8px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:27px;
}

.sidebar-intro{
  margin-top:8px;

  color:#806c5b;

  font-size:12px;

  line-height:1.7;
}

.filter-section{
  margin-top:26px;
}

.filter-label{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;

  font-size:12px;
  font-weight:700;
}

.filter-number{
  color:var(--deep-gold);
}

.segmented{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  padding:4px;

  border:1px solid var(--line);

  border-radius:14px;

  background:rgba(255,255,255,.6);
}

.segmented button{
  padding:9px 5px;

  border:0;

  border-radius:10px;

  color:#796552;

  background:transparent;

  font-size:11px;

  transition:.25s;
}

.segmented button.active{
  color:white;

  background:var(--brown);

  box-shadow:
    0 6px 15px rgba(80,56,36,.17);
}

/* AIR CONDITION */

.ac-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:13px 15px;

  border:1px solid var(--line);

  border-radius:15px;

  background:rgba(255,255,255,.62);
}

.ac-title{
  font-size:12px;
  font-weight:700;
}

.ac-sub{
  margin-top:3px;

  color:#99836f;

  font-size:10px;
}

.switch{
  position:relative;

  width:43px;
  height:24px;

  border:0;
  border-radius:50px;

  background:#d5c7b7;

  transition:.25s;
}

.switch::after{
  content:"";

  position:absolute;

  width:18px;
  height:18px;

  left:3px;
  top:3px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 2px 5px rgba(0,0,0,.15);

  transition:.25s;
}

.switch.on{
  background:var(--green);
}

.switch.on::after{
  transform:translateX(19px);
}

/* CHIPS */

.chips{
  display:flex;
  flex-wrap:wrap;

  gap:8px;
}

.chip{
  padding:8px 12px;

  border:1px solid var(--line);

  border-radius:100px;

  color:#725f4f;

  background:rgba(255,255,255,.55);

  font-size:11px;

  transition:.2s;
}

.chip:hover{
  border-color:#c69a58;
}

.chip.active{
  color:#77501b;

  border-color:#d9ac64;

  background:#f4dfb8;
}

/* COUNT */

.match-box{
  margin-top:27px;

  padding:17px;

  border:1px solid rgba(183,125,42,.18);

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(245,224,186,.65),
      rgba(255,255,255,.72)
    );
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.match-title{
  font-size:11px;

  color:#806a56;
}

.match-count{
  font-family:Georgia,serif;

  color:var(--deep-gold);

  font-size:27px;
  font-weight:bold;
}

.match-text{
  margin-top:5px;

  color:#9a826d;

  font-size:10px;
}

/* BUTTON */

.sort-button{
  width:100%;

  margin-top:15px;
  padding:15px 18px;

  border:0;
  border-radius:16px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #6f5035,
      #3e2e23
    );

  box-shadow:
    0 13px 28px rgba(68,48,33,.22);

  font-size:13px;
  font-weight:700;

  transition:.25s;
}

.sort-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 17px 34px rgba(68,48,33,.28);
}

.sort-button:disabled{
  cursor:not-allowed;

  opacity:.35;

  transform:none;
}

/* =========================================================
   06. STAGE
========================================================= */

.stage{
  position:relative;

  overflow:hidden;
}

#three-container{
  position:absolute;
  inset:0;
}

canvas{
  display:block;
}

/* INTRO */

.stage-copy{
  position:absolute;

  top:27px;
  left:50%;

  transform:translateX(-50%);

  z-index:7;

  text-align:center;

  pointer-events:none;
}

.stage-kicker{
  color:#a77936;

  font-size:10px;

  letter-spacing:.27em;
}

.stage-copy h1{
  margin-top:8px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:31px;
  font-weight:500;
}

.stage-copy p{
  margin-top:6px;

  color:#8d7764;

  font-size:11px;
}

/* TABLE */

.table{
  position:absolute;

  left:50%;
  bottom:-165px;

  width:800px;
  height:300px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse at center,
      #b98a5f 0%,
      #9a6e49 55%,
      #765136 100%
    );

  box-shadow:
    0 -20px 60px rgba(112,77,46,.16),
    inset 0 10px 25px rgba(255,255,255,.12);

  opacity:.7;

  pointer-events:none;
}

/* RESTAURANT ORBITS */

.restaurant-cloud{
  position:absolute;

  inset:0;

  z-index:6;

  pointer-events:none;
}

.restaurant-pill{
  position:absolute;

  padding:8px 12px;

  border:1px solid rgba(167,117,46,.17);

  border-radius:100px;

  color:#775e46;

  background:rgba(255,253,247,.72);

  backdrop-filter:blur(8px);

  box-shadow:
    0 8px 22px rgba(101,72,42,.08);

  font-size:10px;

  opacity:.68;

  transition:.4s;
}

.restaurant-pill.highlight{
  color:white;

  border-color:#c48b32;

  background:#c48b32;

  opacity:1;

  transform:scale(1.1);

  box-shadow:
    0 9px 25px rgba(183,123,40,.3);
}

/* MAGIC MESSAGE */

.magic-message{
  position:absolute;

  left:50%;
  bottom:42px;

  z-index:8;

  transform:translateX(-50%);

  padding:10px 18px;

  border:1px solid rgba(164,113,43,.16);

  border-radius:100px;

  color:#826747;

  background:rgba(255,253,247,.75);

  backdrop-filter:blur(12px);

  font-family:Georgia,"Noto Serif TC",serif;

  font-size:12px;

  box-shadow:
    0 10px 30px rgba(101,72,42,.08);

  transition:.3s;
}

/* =========================================================
   07. RESULT MODAL
========================================================= */

.modal-overlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(70,51,36,.28);

  backdrop-filter:blur(8px);

  opacity:0;
  pointer-events:none;

  transition:.3s;
}

.modal-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.result-card{
  width:min(440px,100%);

  padding:34px;

  border:1px solid rgba(172,119,42,.2);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      #fffdf8,
      #f8eddb
    );

  box-shadow:
    0 35px 100px rgba(69,48,31,.25);

  text-align:center;

  transform:translateY(20px) scale(.97);

  transition:.35s;
}

.modal-overlay.show .result-card{
  transform:translateY(0) scale(1);
}

.result-symbol{
  width:58px;
  height:58px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#8a5a16;

  background:#f1d49b;

  font-family:Georgia,serif;

  font-size:25px;
}

.result-kicker{
  margin-top:19px;

  color:#aa7935;

  font-size:10px;

  letter-spacing:.25em;
}

.result-name{
  margin-top:8px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:31px;
}

.result-distance{
  margin-top:7px;

  color:#806b59;

  font-size:12px;
}

.result-tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:7px;

  margin-top:17px;
}

.result-tags span{
  padding:6px 10px;

  border-radius:100px;

  color:#765624;

  background:#f0dfbd;

  font-size:10px;
}

.modal-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:26px;
}

.modal-actions button,
.modal-actions a{
  padding:12px;

  border-radius:13px;

  text-decoration:none;

  font-size:11px;
}

.map-btn{
  grid-column:1 / -1;

  color:white;

  border:0;

  background:var(--brown);
}

.again-btn{
  color:#604b39;

  border:1px solid var(--line);

  background:white;
}

.filter-btn{
  color:#604b39;

  border:1px solid var(--line);

  background:white;
}

/* =========================================================
   08. RESPONSIVE
========================================================= */

@media(max-width:800px){

  header{
    height:72px;

    padding:0 17px;
  }

  .brand-sub,
  .header-right{
    display:none;
  }

  .app{
    top:72px;

    display:block;
  }

  .sidebar{
    position:absolute;

    left:12px;
    right:12px;
    bottom:12px;

    z-index:20;

    max-height:44vh;

    padding:17px;

    border:1px solid var(--line);

    border-radius:22px;

    box-shadow:var(--shadow);
  }

  .sidebar h2{
    font-size:21px;
  }

  .sidebar-intro{
    display:none;
  }

  .filter-section{
    margin-top:15px;
  }

  .stage{
    width:100%;
    height:100%;
  }

  .stage-copy{
    top:20px;

    width:90%;
  }

  .stage-copy h1{
    font-size:23px;
  }

  .stage-copy p{
    display:none;
  }

  .magic-message{
    bottom:48%;
  }

}

</style>
</head>

<body>

<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="magic-bg">

  <div class="sun-glow"></div>

  <div class="window"></div>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

</div>

<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="brand">

    <div class="logo">
      AI3
    </div>

    <div>

      <div class="brand-title">
        魔法午餐分類帽
      </div>

      <div class="brand-sub">
        AI3 · NANGANG LUNCH ORACLE
      </div>

    </div>

  </div>

  <div class="header-right">

    <span class="status-dot"></span>

    <span>
      南港軟體園區 · 今日魔法正常
    </span>

  </div>

</header>

<!-- =========================================================
     APP
========================================================= -->

<div class="app">

<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

  <div class="sidebar-kicker">
    Before the spell
  </div>

  <h2>
    今日想食啥？
  </h2>

  <p class="sidebar-intro">
    先講你的條件，剩下的交予魔法分類帽。
    猶豫太久，午休就欲無矣。
  </p>

  <!-- DISTANCE -->

  <div class="filter-section">

    <div class="filter-label">

      <span>
        可以行偌遠？
      </span>

      <span
        id="distanceDisplay"
        class="filter-number">
        2 KM
      </span>

    </div>

    <div class="segmented">

      <button
        data-distance="500">
        500m
      </button>

      <button
        data-distance="1000">
        1km
      </button>

      <button
        data-distance="2000"
        class="active">
        2km
      </button>

    </div>

  </div>

  <!-- AC -->

  <div class="filter-section">

    <div class="filter-label">
      <span>
        環境條件
      </span>
    </div>

    <div class="ac-row">

      <div>

        <div class="ac-title">
          必須有冷氣
        </div>

        <div class="ac-sub">
          台北的夏天，這條很重要。
        </div>

      </div>

      <button
        id="acSwitch"
        class="switch on">
      </button>

    </div>

  </div>

  <!-- FOOD -->

  <div class="filter-section">

    <div class="filter-label">

      <span>
        今日想食
      </span>

      <span style="
        font-size:9px;
        color:#a58b72;
        font-weight:400;
      ">
        可複選
      </span>

    </div>

    <div
      id="foodChips"
      class="chips">

      <button
        class="chip active"
        data-food="飯">
        🍚 飯
      </button>

      <button
        class="chip active"
        data-food="麵">
        🍜 麵
      </button>

      <button
        class="chip active"
        data-food="鍋貼/水餃">
        🥟 鍋貼 / 水餃
      </button>

      <button
        class="chip active"
        data-food="漢堡/美式">
        🍔 漢堡 / 美式
      </button>

      <button
        class="chip active"
        data-food="小吃">
        🍢 小吃
      </button>

      <button
        class="chip active"
        data-food="健康餐">
        🥗 健康餐
      </button>

    </div>

  </div>

  <!-- MATCH -->

  <div class="match-box">

    <div class="match-top">

      <span class="match-title">
        魔法範圍內
      </span>

      <span
        id="matchCount"
        class="match-count">
        0
      </span>

    </div>

    <div
      id="matchText"
      class="match-text">
      間餐廳等待分類
    </div>

  </div>

  <button
    id="sortButton"
    class="sort-button">

    ✦ 讓分類帽決定午餐

  </button>

</aside>

<!-- =========================================================
     3D STAGE
========================================================= -->

<main class="stage">

  <div class="stage-copy">

    <div class="stage-kicker">
      THE LUNCH ORACLE
    </div>

    <h1>
      午餐，不需要再開會。
    </h1>

    <p>
      拖曳看看分類帽，或直接讓它替你決定。
    </p>

  </div>

  <div id="three-container"></div>

  <div class="table"></div>

  <div
    id="restaurantCloud"
    class="restaurant-cloud">
  </div>

  <div
    id="magicMessage"
    class="magic-message">

    分類帽正在等你下令……

  </div>

</main>

</div>

<!-- =========================================================
     RESULT MODAL
========================================================= -->

<div
  id="resultModal"
  class="modal-overlay">

  <div class="result-card">

    <div class="result-symbol">
      ✦
    </div>

    <div class="result-kicker">
      THE HAT HAS SPOKEN
    </div>

    <div
      id="resultName"
      class="result-name">
    </div>

    <div
      id="resultDistance"
      class="result-distance">
    </div>

    <div
      id="resultTags"
      class="result-tags">
    </div>

    <div class="modal-actions">

      <a
        id="mapButton"
        class="map-btn"
        target="_blank"
        rel="noopener">

        開啟 Google 地圖 →

      </a>

      <button
        id="againButton"
        class="again-btn">

        ↻ 不服，再抽

      </button>

      <button
        id="closeButton"
        class="filter-btn">

        重新篩選

      </button>

    </div>

  </div>

</div>

<script>

/* =========================================================
   RESTAURANT DATA
   可以直接在這裡繼續加入 AI3 附近餐廳
========================================================= */

const restaurants = [

  {
    id:"r01",
    name:"樂法 Le Phu",
    distanceMeters:300,
    hasAC:true,
    categories:["漢堡/美式","小吃"],
    googleMapUrl:"https://www.google.com/maps/search/?api=1&query=樂法+南港",
    priceRange:"$"
  },

  {

/* =========================================================
   FILTER STATE
========================================================= */

let maxDistance = 2000;
let requireAC = true;

let selectedFoods = new Set([
  "飯",
  "麵",
  "鍋貼/水餃",
  "漢堡/美式",
  "小吃",
  "健康餐"
]);

/* =========================================================
   FILTER LOGIC
========================================================= */

function updateFilter(){

  filteredRestaurants = restaurants.filter(r => {

    const distanceOK =
      r.distanceMeters <= maxDistance;

    const acOK =
      !requireAC || r.hasAC;

    const foodOK =
      r.categories.some(
        category => selectedFoods.has(category)
      );

    return distanceOK && acOK && foodOK;

  });

  document.getElementById("matchCount").textContent =
    filteredRestaurants.length;

  document.getElementById("matchText").textContent =
    filteredRestaurants.length
      ? "間餐廳正在等待魔法分類"
      : "沒有符合條件的餐廳";

  document.getElementById("sortButton").disabled =
    filteredRestaurants.length === 0;

  updateRestaurantCloud();

}


/* =========================================================
   DISTANCE
========================================================= */

document
.querySelectorAll("[data-distance]")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll("[data-distance]")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    maxDistance =
      Number(button.dataset.distance);

    document.getElementById(
      "distanceDisplay"
    ).textContent =
      maxDistance === 500
        ? "500 M"
        : maxDistance === 1000
        ? "1 KM"
        : "2 KM";

    updateFilter();

  });

});


/* =========================================================
   AC SWITCH
========================================================= */

const acSwitch =

acSwitch.addEventListener("click", () => {

  requireAC = !requireAC;

  acSwitch.classList.toggle(
    "on",
    requireAC
  );

  updateFilter();

});


/* =========================================================
   FOOD CHIPS
========================================================= */

document
.querySelectorAll("[data-food]")
.forEach(button => {

  button.addEventListener("click", () => {

    const food =
      button.dataset.food;

    if(selectedFoods.has(food)){

      selectedFoods.delete(food);

      button.classList.remove("active");

    }else{

      selectedFoods.add(food);

      button.classList.add("active");

    }

    updateFilter();

  });

});

){

  const radius =
    2.3 +
    Math.random() * 2;

  const angle =
    Math.random() *
    Math.PI *
    2;

  particlePositions[
    i * 3
  ] =
    Math.cos(angle) *
    radius;

  particlePositions[
    i * 3 + 1
  ] =
    Math.random() *
    5 -
    .5;

  particlePositions[
    i * 3 + 2
  ] =
    Math.sin(angle) *
    radius;

}

particleGeometry.setAttribute(

  "position",

  new THREE.BufferAttribute(
    particlePositions,
    3
  )

);

/* =========================================================
   DRAG INTERACTION
========================================================= */

let dragging = false;

let previousX = 0;

let targetRotation = 0;


renderer.domElement
.addEventListener(
  "pointerdown",
  event => {

    dragging = true;

    previousX =
      event.clientX;

  }
);


window.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


window.addEventListener(
  "pointermove",
  event => {

    if(
      !dragging ||
      isSorting
    ) return;

    const delta =
      event.clientX -
      previousX;

    targetRotation +=
      delta * .006;

    previousX =
      event.clientX;

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();

let sortStart = 0;

let sortDuration = 3;

let selectedRestaurant = null;

let sortStartRotation = 0;

let sortEndRotation = 0;


function easeOutCubic(t){

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


function animate(){

  requestAnimationFrame(
    animate
  );

  const time =
    clock.getElapsedTime();

  /* normal floating */

  if(!isSorting){

    hat.rotation.y +=
      (
        targetRotation -
        hat.rotation.y
      ) * .06;

    hat.position.y =
      -.3 +
      Math.sin(time * 1.5) *
      .045;

    crown.rotation.z =
      -.12 +
      Math.sin(time * 1.2) *
      .015;

    mouth.scale.y =
      .75 +
      Math.sin(time * 1.6) *
      .035;

  }

  /* sorting */

  if(isSorting){

    const elapsed =
      performance.now() /
      1000 -
      sortStart;

    const progress =
      Math.min(
        elapsed /
        sortDuration,
        1
      );

    const eased =
      easeOutCubic(progress);

    hat.rotation.y =
      sortStartRotation +
      (
        sortEndRotation -
        sortStartRotation
      ) *
      eased;

    hat.rotation.z =
      Math.sin(
        progress *
        Math.PI *
        10
      ) *
      .13 *
      (1-progress);

    hat.position.y =
      -.3 +
      Math.sin(
        progress *
        Math.PI *
        8
      ) *
      .16 *
      (1-progress);

    mouth.scale.y =
      .7 +
      Math.sin(
        progress *
        Math.PI *
        12
      ) *
      .22;

    particleMaterial.opacity =
      .45 +
      Math.sin(
        time * 10
      ) *
      .25;

    if(progress >= 1){

      finishSorting();

    }

  }

  magicRing.rotation.z +=
    .0018;

  magicRing2.rotation.z -=
    .001;

  particles.rotation.y +=
    .0007;

  renderer.render(
    scene,
    camera
  );

}

animate();


/* =========================================================
   SORTING
========================================================= */

const messages = [

  "嗯……這間似乎不錯……",

  "等一下，我聽到你的胃在講話……",

  "飯？麵？還是命運？",

  "魔法正在排除太遠的午餐……",

  "今天不准再說「隨便」……"

];


function startSorting(){

  if(
    isSorting ||
    !filteredRestaurants.length
  ) return;

  isSorting = true;

  selectedRestaurant =
    filteredRestaurants[
      Math.floor(
        Math.random() *
        filteredRestaurants.length
      )
    ];

  sortStart =
    performance.now() /
    1000;

  sortStartRotation =
    hat.rotation.y;

  sortEndRotation =
    sortStartRotation +
    Math.PI *
    (
      6 +
      Math.random() * 3
    );

  document.getElementById(
    "sortButton"
  ).disabled = true;

  const message =
    document.getElementById(
      "magicMessage"
    );

  message.textContent =
    "分類帽正在思考……";

  let messageIndex = 0;

  window.sortMessageTimer =
    setInterval(() => {

      message.textContent =
        messages[
          messageIndex %
          messages.length
        ];

      messageIndex++;

    },550);

}


function finishSorting(){

  isSorting = false;

  clearInterval(
    window.sortMessageTimer
  );

  hat.rotation.z = 0;

  targetRotation =
    hat.rotation.y;

  particleMaterial.opacity =
    .5;

  document.getElementById(
    "magicMessage"
  ).textContent =
    "決定了！就是這間 ✦";

  highlightRestaurant(
    selectedRestaurant
  );

  setTimeout(() => {

    showResult(
      selectedRestaurant
    );

    document.getElementById(
      "sortButton"
    ).disabled = false;

  },550);

}


document.getElementById(
  "sortButton"
).addEventListener(
  "click",
  startSorting
);

    Math.max(

      Math.round(

    `${restaurant.distanceMeters} 公尺 · 步行約 ${minutes} 分鐘`;


  const tags =
    document.getElementById(
      "resultTags"
    );


  tags.innerHTML = "";


  [
    restaurant.hasAC
      ? "❄ 有冷氣"
      : "戶外 / 無冷氣",

    ...restaurant.categories,

    restaurant.priceRange

  ].forEach(tag => {

    const span =
      document.createElement(
        "span"
      );

    span.textContent = tag;

    tags.appendChild(span);

  });


  document.getElementById(
    "mapButton"
  ).href =
    restaurant.googleMapUrl;


  document.getElementById(
    "resultModal"
  ).classList.add(
    "show"
  );

}
