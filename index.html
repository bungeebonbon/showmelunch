<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午餐大象｜重慶北路今天吃什麼？</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --cream:#fff7e8;
  --paper:#fffdf8;
  --red:#d95f52;
  --deep-red:#b8423b;
  --gold:#e7ae46;
  --blue:#5d8796;
  --ink:#49362e;
  --muted:#8b756a;
  --line:rgba(73,54,46,.13);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 50% 20%,#fffdf6 0%,#fff4dd 45%,#f3dfbd 100%);
}

button{font:inherit;cursor:pointer}

/* ================= HEADER ================= */

header{
  position:absolute;
  left:0;right:0;top:0;
  height:82px;
  z-index:30;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 34px;

  background:rgba(255,253,248,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:47px;
  height:47px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  background:var(--red);

  font-size:22px;

  box-shadow:0 8px 20px rgba(185,66,59,.2);
}

.brand h1{
  font-family:Georgia,"Noto Serif TC",serif;
  font-size:19px;
}

.brand small{
  display:block;
  margin-top:3px;
  color:#a08372;
  font-size:9px;
  letter-spacing:.2em;
}

.location{
  font-size:11px;
  color:#866e61;

  display:flex;
  align-items:center;
  gap:8px;
}

.location-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#5d9270;
}

/* ================= LAYOUT ================= */

.app{
  position:absolute;
  top:82px;
  bottom:0;
  left:0;
  right:0;

  display:grid;
  grid-template-columns:300px 1fr;
}

/* ================= SIDEBAR ================= */

.sidebar{
  z-index:20;
  padding:27px 23px;
  overflow-y:auto;

  background:rgba(255,253,248,.78);
  backdrop-filter:blur(18px);

  border-right:1px solid var(--line);
}

.kicker{
  color:var(--deep-red);
  font-size:9px;
  letter-spacing:.22em;
}

.sidebar h2{
  margin-top:8px;
  font-family:Georgia,"Noto Serif TC",serif;
  font-size:25px;
}

.intro{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.filter{
  margin-top:24px;
}

.label{
  margin-bottom:11px;
  font-size:11px;
  font-weight:700;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:100px;

  background:white;
  color:#765e51;

  font-size:10px;

  transition:.2s;
}

.chip.active{
  color:white;
  background:var(--red);
  border-color:var(--red);
}

.countbox{
  margin-top:25px;
  padding:16px;

  border-radius:17px;

  background:#f9e7c6;
  border:1px solid rgba(200,143,49,.16);
}

.counttop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.counttitle{
  color:#876f5f;
  font-size:10px;
}

#count{
  color:var(--deep-red);
  font-family:Georgia,serif;
  font-size:28px;
}

.countdesc{
  margin-top:3px;
  color:#9a7e6c;
  font-size:9px;
}

.pick{
  width:100%;

  margin-top:13px;
  padding:15px;

  border:0;
  border-radius:15px;

  color:white;

  background:
    linear-gradient(135deg,#dc6758,#bd443d);

  font-weight:700;
  font-size:12px;

  box-shadow:0 12px 28px rgba(190,67,59,.22);

  transition:.25s;
}

.pick:hover{
  transform:translateY(-2px);
}

.pick:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* ================= STAGE ================= */

.stage{
  position:relative;
  overflow:hidden;
}

#three{
  position:absolute;
  inset:0;
}

/* Circus stripes */

.circus-top{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);

  width:560px;
  height:145px;

  opacity:.13;

  background:
    repeating-linear-gradient(
      110deg,
      var(--red) 0 42px,
      transparent 42px 84px
    );

  clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);
}

.stage-title{
  position:absolute;
  top:27px;
  left:50%;
  transform:translateX(-50%);

  z-index:5;

  text-align:center;
  pointer-events:none;
}

.stage-title small{
  color:#b06e43;
  font-size:9px;
  letter-spacing:.25em;
}

.stage-title h2{
  margin-top:7px;
  font-family:Georgia,"Noto Serif TC",serif;
  font-size:28px;
  font-weight:500;
}

.stage-title p{
  margin-top:5px;
  color:#92786a;
  font-size:10px;
}

/* restaurant labels */

.restaurant-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:7;
}

.restaurant{
  position:absolute;

  width:145px;
  min-height:54px;

  padding:9px 12px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  text-align:center;

  border-radius:13px;

  background:rgba(255,253,248,.88);
  border:1px solid rgba(139,91,62,.14);

  box-shadow:0 9px 24px rgba(86,57,41,.09);

  backdrop-filter:blur(8px);

  transition:.35s;
}

.restaurant-name{
  font-size:10px;
  font-weight:700;
}

.restaurant-type{
  margin-top:3px;
  color:#a18676;
  font-size:8px;
}

.restaurant.selected{
  color:white;
  background:var(--red);
  border-color:var(--red);

  transform:scale(1.12);

  box-shadow:0 13px 35px rgba(191,67,58,.3);
}

.restaurant.selected .restaurant-type{
  color:#ffe5d8;
}

/* ground */

.ring{
  position:absolute;

  left:50%;
  bottom:-100px;

  width:660px;
  height:260px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #f3cf8e 0%,
      #e4b96d 45%,
      #cc9850 100%
    );

  opacity:.4;

  box-shadow:0 -15px 60px rgba(173,116,50,.13);
}

/* message */

.message{
  position:absolute;

  left:50%;
  bottom:30px;

  z-index:10;

  transform:translateX(-50%);

  padding:10px 18px;

  border-radius:100px;

  background:rgba(255,253,248,.88);
  border:1px solid var(--line);

  color:#81685a;

  font-family:Georgia,"Noto Serif TC",serif;
  font-size:11px;

  box-shadow:0 8px 25px rgba(86,57,41,.08);
}

/* ================= RESULT ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(72,49,38,.25);
  backdrop-filter:blur(8px);

  opacity:0;
  pointer-events:none;

  transition:.3s;
}

.modal.show{
  opacity:1;
  pointer-events:auto;
}

.card{
  width:min(430px,100%);
  padding:33px;

  text-align:center;

  border-radius:27px;

  background:#fffdf8;

  border:1px solid rgba(188,128,55,.17);

  box-shadow:0 35px 100px rgba(70,45,32,.24);

  transform:translateY(18px) scale(.97);
  transition:.3s;
}

.modal.show .card{
  transform:none;
}

.icon{
  width:65px;height:65px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#f8dfb0;

  font-size:31px;
}

.result-kicker{
  margin-top:17px;
  color:#bc7547;
  font-size:9px;
  letter-spacing:.23em;
}

#resultName{
  margin-top:8px;

  font-family:Georgia,"Noto Serif TC",serif;
  font-size:29px;
}

#resultInfo{
  margin-top:7px;
  color:#8b7366;
  font-size:11px;
}

.tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;

  margin-top:15px;
}

.tags span{
  padding:6px 9px;

  border-radius:100px;

  background:#f6e4c3;

  color:#785a3e;

  font-size:9px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:24px;
}

.actions a,
.actions button{
  padding:12px;

  border-radius:12px;

  font-size:10px;
  text-decoration:none;
}

.map{
  grid-column:1/-1;

  color:white;
  background:var(--red);
}

.secondary{
  color:#6c5549;
  background:white;
  border:1px solid var(--line);
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  header{
    height:70px;
    padding:0 16px;
  }

  .location,
  .brand small{
    display:none;
  }

  .app{
    top:70px;
    display:block;
  }

  .stage{
    width:100%;
    height:100%;
  }

  .sidebar{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    z-index:30;

    max-height:40vh;

    padding:16px;

    border:1px solid var(--line);
    border-radius:20px;

    box-shadow:0 20px 50px rgba(80,50,30,.15);
  }

  .sidebar h2{
    font-size:20px;
  }

  .intro{
    display:none;
  }

  .filter{
    margin-top:13px;
  }

  .stage-title h2{
    font-size:21px;
  }

  .stage-title p{
    display:none;
  }

  .restaurant{
    width:110px;
  }

  .message{
    bottom:43%;
  }

}

</style>
</head>

<body>

<header>

<div class="brand">

  <div class="logo">🐘</div>

  <div>
    <h1>午餐大象</h1>
    <small>THE GREAT LUNCH CIRCUS</small>
  </div>

</div>

<div class="location">
  <span class="location-dot"></span>
  重慶北路一段 1-1 號周邊
</div>

</header>


<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

<div class="kicker">
TODAY'S LUNCH SHOW
</div>

<h2>
今天到底吃什麼？
</h2>

<p class="intro">
選一下你今天的心情，然後不要再討論了。
讓大象的鼻子替大家做決定。
</p>


<div class="filter">

  <div class="label">
    今天想吃
  </div>

  <div class="chips">

    <button class="chip active" data-type="台式">
      🍚 台式
    </button>

    <button class="chip active" data-type="日式">
      🍣 日式
    </button>

    <button class="chip active" data-type="咖哩">
      🍛 咖哩
    </button>

    <button class="chip active" data-type="麵食">
      🍜 麵食
    </button>

    <button class="chip active" data-type="餐盒">
      🍱 餐盒
    </button>

  </div>

</div>


<div class="filter">

  <div class="label">
    預算
  </div>

  <div class="chips">

    <button class="chip active" data-price="1">
      $ 平價
    </button>

    <button class="chip active" data-price="2">
      $$ 中等
    </button>

  </div>

</div>


<div class="countbox">

  <div class="counttop">

    <span class="counttitle">
      今天參加表演的餐廳
    </span>

    <span id="count">
      0
    </span>

  </div>

  <div class="countdesc">
    間餐廳等待大象點名
  </div>

</div>


<button id="pickButton" class="pick">
🐘 大象幫我選！
</button>

</aside>


<!-- ================= 3D ================= -->

<main class="stage">

<div class="circus-top"></div>

<div class="stage-title">

  <small>
    THE GREAT LUNCH CIRCUS
  </small>

  <h2>
    看象鼻今天指向哪一間。
  </h2>

  <p>
    點擊開始後，象鼻會自己替你的午休負責。
  </p>

</div>

<div id="three"></div>

<div class="ring"></div>

<div
  id="restaurantLayer"
  class="restaurant-layer">
</div>

<div
  id="message"
  class="message">
  🐘 大象正在等你下令……
</div>

</main>

</div>


<!-- ================= RESULT ================= -->

<div id="modal" class="modal">

<div class="card">

  <div class="icon">
    🐘
  </div>

  <div class="result-kicker">
    THE ELEPHANT HAS DECIDED
  </div>

  <div id="resultName"></div>

  <div id="resultInfo"></div>

  <div id="resultTags" class="tags"></div>

  <div class="actions">

    <a
      id="mapLink"
      class="map"
      target="_blank"
      rel="noopener">
      Google 地圖看看 →
    </a>

    <button
      id="again"
      class="secondary">
      ↻ 鼻子再甩一次
    </button>

    <button
      id="close"
      class="secondary">
      我想重新選
    </button>

  </div>

</div>

</div>


<script>

/* =========================================================
   RESTAURANTS
   基準點：台北市重慶北路一段 1-1 號
========================================================= */

const restaurants = [

{
 id:1,
 name:"No Design Kitchen 無設廚房",
 type:["餐盒","台式"],
 price:1,
 note:"重慶北路一段 1 號",
 map:"https://www.google.com/maps/search/?api=1&query=No+Design+Kitchen+無設廚房"
},

{
 id:2,
 name:"一刺生魚片丼飯握壽司",
 type:["日式"],
 price:2,
 note:"重慶北路一段 6 號",
 map:"https://www.google.com/maps/search/?api=1&query=一刺生魚片丼飯握壽司"
},

{
 id:3,
 name:"元味料理",
 type:["台式"],
 price:1,
 note:"華陰街 227 巷",
 map:"https://www.google.com/maps/search/?api=1&query=元味料理+台北"
},

{
 id:4,
 name:"大稻埕米粉湯",
 type:["台式","麵食"],
 price:1,
 note:"重慶北路一段 26 巷",
 map:"https://www.google.com/maps/search/?api=1&query=大稻埕米粉湯"
},

{
 id:5,
 name:"三多屋爸爸嘴",
 type:["日式"],
 price:2,
 note:"太原路 19 號",
 map:"https://www.google.com/maps/search/?api=1&query=三多屋爸爸嘴"
},

{
 id:6,
 name:"羅本家咖哩 大同店",
 type:["日式","咖哩"],
 price:2,
 note:"長安西路 138 巷",
 map:"https://www.google.com/maps/search/?api=1&query=羅本家咖哩大同店"
},

{
 id:7,
 name:"新高軒 北車店",
 type:["日式","咖哩"],
 price:2,
 note:"北平西路 3 號",
 map:"https://www.google.com/maps/search/?api=1&query=新高軒北車店"
},

{
 id:8,
 name:"雞湯桑 Torisan",
 type:["日式","麵食"],
 price:2,
 note:"京站 B3",
 map:"https://www.google.com/maps/search/?api=1&query=雞湯桑+Torisan+京站"
}

];


/* =========================================================
   FILTER
========================================================= */

let selectedTypes =
new Set([
 "台式",
 "日式",
 "咖哩",
 "麵食",
 "餐盒"
]);

let selectedPrices =
new Set([1,2]);

let filtered=[];

let selected=null;

let spinning=false;


function updateFilter(){

 filtered=restaurants.filter(r=>{

   const typeOK=
   r.type.some(t=>selectedTypes.has(t));

   const priceOK=
   selectedPrices.has(r.price);

   return typeOK && priceOK;

 });

 document.getElementById("count").textContent=
 filtered.length;

 document.getElementById("pickButton").disabled=
 filtered.length===0;

 renderRestaurants();

}


document
.querySelectorAll("[data-type]")
.forEach(btn=>{

 btn.onclick=()=>{

   const value=btn.dataset.type;

   if(selectedTypes.has(value)){
     selectedTypes.delete(value);
     btn.classList.remove("active");
   }else{
     selectedTypes.add(value);
     btn.classList.add("active");
   }

   updateFilter();

 };

});


document
.querySelectorAll("[data-price]")
.forEach(btn=>{

 btn.onclick=()=>{

   const value=
   Number(btn.dataset.price);

   if(selectedPrices.has(value)){
     selectedPrices.delete(value);
     btn.classList.remove("active");
   }else{
     selectedPrices.add(value);
     btn.classList.add("active");
   }

   updateFilter();

 };

});


/* =========================================================
   RESTAURANT POSITIONS
========================================================= */

const positions=[
 [17,25],
 [72,25],
 [8,45],
 [81,45],
 [14,67],
 [74,67],
 [31,18],
 [60,18]
];


function renderRestaurants(){

 const layer=
 document.getElementById("restaurantLayer");

 layer.innerHTML="";

 filtered.forEach((r,i)=>{

   const item=
   document.createElement("div");

   item.className="restaurant";

   item.dataset.id=r.id;

   const pos=
   positions[i % positions.length];

   item.style.left=pos[0]+"%";
   item.style.top=pos[1]+"%";

   item.innerHTML=`
     <div class="restaurant-name">
       ${r.name}
     </div>

     <div class="restaurant-type">
       ${r.type.join(" · ")}
     </div>
   `;

   layer.appendChild(item);

 });

}


/* =========================================================
   THREE.JS
========================================================= */

const container=
document.getElementById("three");

const scene=
new THREE.Scene();


const camera=
new THREE.PerspectiveCamera(
 38,
 container.clientWidth/container.clientHeight,
 .1,
 100
);

camera.position.set(
 0,
 1,
 8
);


/* renderer */

const renderer=
new THREE.WebGLRenderer({
 antialias:true,
 alpha:true
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);

renderer.setSize(
 container.clientWidth,
 container.clientHeight
);

renderer.shadowMap.enabled=true;

renderer.outputEncoding=
THREE.sRGBEncoding;

container.appendChild(
 renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
 new THREE.HemisphereLight(
   0xfff6df,
   0xb88c69,
   2.1
 )
);


const key=
new THREE.DirectionalLight(
 0xffe1a5,
 2.4
);

key.position.set(
 -4,7,5
);

key.castShadow=true;

scene.add(key);


const fill=
new THREE.DirectionalLight(
 0xffffff,
 1.5
);

fill.position.set(
 5,3,4
);

scene.add(fill);


/* =========================================================
   ELEPHANT
========================================================= */

const elephant=
new THREE.Group();

elephant.position.y=-.25;

scene.add(elephant);


const skin=
new THREE.MeshStandardMaterial({
 color:0x8ba4a7,
 roughness:.72
});


const skinDark=
new THREE.MeshStandardMaterial({
 color:0x6d8589,
 roughness:.8
});


const pink=
new THREE.MeshStandardMaterial({
 color:0xd89b9c,
 roughness:.75
});


const eyeMat=
new THREE.MeshStandardMaterial({
 color:0x292522,
 roughness:.5
});


/* BODY */

const body=
new THREE.Mesh(
 new THREE.SphereGeometry(
   1.45,40,30
 ),
 skin
);

body.scale.set(
 1.15,1.05,.9
);

body.position.y=.15;

body.castShadow=true;

elephant.add(body);


/* HEAD */

const head=
new THREE.Mesh(
 new THREE.SphereGeometry(
   1.05,40,30
 ),
 skin
);

head.position.set(
 0,1.2,.75
);

head.scale.set(
 1,1,.85
);

head.castShadow=true;

elephant.add(head);


/* EARS */

function makeEar(x){

 const ear=
 new THREE.Mesh(
   new THREE.SphereGeometry(
     .85,30,20
   ),
   skin
 );

 ear.scale.set(
   .28,1,.7
 );

 ear.position.set(
   x,1.35,.55
 );

 return ear;
}

const earL=makeEar(-1);
const earR=makeEar(1);

elephant.add(earL);
elephant.add(earR);


/* inner ears */

function innerEar(x){

 const e=
 new THREE.Mesh(
   new THREE.SphereGeometry(
     .62,24,18
   ),
   pink
 );

 e.scale.set(
   .18,.85,.55
 );

 e.position.set(
   x,1.35,.72
 );

 return e;
}

elephant.add(
 innerEar(-1.04)
);

elephant.add(
 innerEar(1.04)
);


/* EYES */

function eye(x){

 const e=
 new THREE.Mesh(
   new THREE.SphereGeometry(
     .095,18,12
   ),
   eyeMat
 );

 e.position.set(
   x,1.48,1.56
 );

 return e;
}

elephant.add(eye(-.35));
elephant.add(eye(.35));


/* LEGS */

function leg(x,z){

 const l=

/* =========================================================
   TRUNK MOTION
========================================================= */

const clock=
new THREE.Clock();

let startTime=0;
let duration=4.2;


/*
   每一節象鼻根據 sway 產生不同幅度，
   所以不是整條像木棍旋轉，
   而是會有甩動的感覺。
*/

function animateTrunk(sway){

 trunkSegments.forEach(
   (segment,index)=>{

     const influence=
     index/(segmentCount-1);

     segment.position.x=
       Math.sin(
         sway+
         influence*1.8
       ) *
       influence *
       .72;

     segment.rotation.z=
       Math.sin(
         sway+
         influence*1.5
       ) *
       influence *
       .34;

   }
 );

}


/* =========================================================
   ANIMATION
========================================================= */

function easeOut(t){
 return 1-Math.pow(1-t,4);
}


function animate(){

 requestAnimationFrame(animate);

 const time=
 clock.getElapsedTime();


 if(!spinning){

   animateTrunk(
     Math.sin(time*1.5)*.45
   );

   elephant.position.y=
     -.25+
     Math.sin(time*1.25)*.035;

   earL.rotation.z=
     Math.sin(time*1.4)*.035;

   earR.rotation.z=
     -Math.sin(time*1.4)*.035;

 }


 if(spinning){

   const elapsed=
   performance.now()/1000-startTime;

   const p=
   Math.min(
     elapsed/duration,
     1
   );

   /*
      一開始速度很快，
      最後慢慢收斂到選中的方向。
   */

   const speed=
   (1-p);

   const sway=
   Math.sin(
     p*Math.PI*18
   ) *
   2.8 *
   speed;

   animateTrunk(sway);


   elephant.rotation.y=
     Math.sin(
       p*Math.PI*9
     ) *
     .17 *
     speed;


   earL.rotation.z=
     Math.sin(
       p*Math.PI*15
     )*.2*speed;

   earR.rotation.z=
     -earL.rotation.z;


   if(p>=1){
     finishPick();
   }

 }


 particles.rotation.y+=.0008;

 renderer.render(
   scene,
   camera
 );

}

animate();

const messages=[

 "鼻子開始甩囉——",

 "等等……它好像聞到咖哩了……",

 "這邊？還是那邊？",

 "大象說不要再回答「都可以」……",

 "午休時間正在倒數……",

 "快決定了！"

];


function startPick(){

 if(
   spinning ||
   !filtered.length
 ) return;


 spinning=true;


 selected=
 filtered[
   Math.floor(
     Math.random()*filtered.length
   )
 ];


 startTime=
 performance.now()/1000;


 document.getElementById(
   "pickButton"
 ).disabled=true;


 let index=0;


 document.getElementById(
   "message"
 ).textContent=
 messages[0];


 window.msgTimer=
 setInterval(()=>{

   index++;

   document.getElementById(
     "message"
   ).textContent=
     messages[
       index%messages.length
     ];

 },620);

}


function finishPick(){

 spinning=false;

 clearInterval(
   window.msgTimer
 );


 document.getElementById(
   "message"
 ).textContent=
 "🐘 就是它！大象決定了！";


 document
 .querySelectorAll(".restaurant")
 .forEach(el=>{

   el.classList.toggle(
     "selected",
     Number(el.dataset.id)===
     selected.id
   );

 });


 setTimeout(
   ()=>showResult(selected),
   600
 );


 document.getElementById(
   "pickButton"
 ).disabled=false;

}


document.getElementById(
 "pickButton"
).onclick=startPick;

function showResult(r){

 ).textContent=r.name;


 document.getElementById(
   "resultInfo"
 ).textContent=r.note;


 const tagBox=
 document.getElementById(
   "resultTags"
 );


 tagBox.innerHTML="";


 [
   ...r.type,
   r.price===1
     ? "$ 平價午餐"
     : "$$ 中等預算"
 ].forEach(tag=>{

   const span=
   document.createElement(
     "span"
   );

   span.textContent=tag;

   tagBox.appendChild(span);

 });


 document.getElementById(
   "mapLink"
 ).href=r.map;


 document.getElementById(
   "modal"
 ).classList.add(
   "show"
 );

}

 "again"
